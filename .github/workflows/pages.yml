# Veröffentlicht die Website auf GitHub Pages.
#
# Voraussetzung (einmalig, nur der Repo-Eigentümer kann das):
#   Settings -> Pages -> Source: "GitHub Actions"
# Der Actions-Token darf Pages nicht selbst erstmalig einschalten.
#
# Danach läuft dieser Workflow bei jedem Push auf den Branch und lässt
# sich zusätzlich von Hand starten (Actions -> Website veroeffentlichen
# -> Run workflow).
#
# Wer stattdessen unter Settings -> Pages "Deploy from a branch" wählt,
# braucht diesen Workflow nicht - dann kann die Datei gelöscht werden.
name: Website veroeffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
